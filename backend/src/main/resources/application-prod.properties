spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=300MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Sobrescreve o secret em produção
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# ==========================================================
# DESATIVA OPEN-IN-VIEW
# Evita consultas ao banco fora da camada de serviço
# Melhora controle de transação e performance
# ==========================================================
spring.jpa.open-in-view=false

# ============================================================
# LOGGING LEVELS - PRODUÇÃO
# ============================================================
# Em produção, manter logs no nível WARN/ERROR
# Previne exposição de dados sensíveis
# ============================================================
logging.level.root=WARN
logging.level.com.geradorexcedente=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN


# =====================================================
# 🍪 CONFIGURAÇÃO DE COOKIES - PRODUÇÃO
# =====================================================
#
# Frontend:
# https://gerador-excedente.netlify.app
#
# Backend:
# https://gerador-excedente-web.onrender.com
#
# Como frontend e backend estão em domínios diferentes,
# os cookies precisam ser enviados entre origens.
#
# SameSite=None:
# - Permite envio de cookies cross-site.
# - Necessário para integração Netlify + Render.
#
# Secure=true:
# - Obrigatório quando SameSite=None.
# - Garante transmissão apenas via HTTPS.
#
# ⚠️ IMPORTANTE:
# Alterar estas configurações caso frontend e backend
# passem a utilizar o mesmo domínio.
#
# =====================================================

app.cookie.same-site=None
app.cookie.secure=true

